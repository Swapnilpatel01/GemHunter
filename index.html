<body>
<div id="app">
  <header class="topbar" id="topbar">
    <button class="back" id="back" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="title">Hidden gems</h1>
    <div class="topbar-right" id="topbar-right"></div>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <a href="#/gems" data-tab="gems"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z M2 9h20 M9 3l-2 6 5 12 5-12-2-6"/></svg><span>Gems</span></a>
    <a href="#/research" data-tab="research"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><span>Research</span></a>
    <a href="#/portfolio" data-tab="portfolio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18 M6 16v-5 M11 16V7 M16 16v-8 M21 16V4"/></svg><span>Portfolio</span></a>
    <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3 M12 19v3 M2 12h3 M19 12h3 M4.9 4.9l2.1 2.1 M17 17l2.1 2.1 M4.9 19.1L7 17 M17 7l2.1-2.1"/></svg><span>Settings</span></a>
  </nav>
</div>
<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="app.js"></script>
